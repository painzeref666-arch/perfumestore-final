<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#8A0303">
    <title>You're offline — Exousia &amp; Co.</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #E7E5E4; color: #700404; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #B91C1C; border-radius: 24px; background: #FFF9F2; text-align: center; box-shadow: 0 12px 40px #70040418; }
      img { width: 72px; height: 72px; object-fit: contain; border-radius: 18px; background: #090909; }
      h1 { margin: 20px 0 8px; font-family: Georgia, serif; }
      p { line-height: 1.6; color: #51483F; }
      button { margin-top: 12px; border: 0; border-radius: 999px; padding: 12px 20px; background: #8A0303; color: white; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192-v2.png" alt="">
      <h1>You're offline</h1>
      <p>Connect to the internet, then try again to browse the Exousia &amp; Co. store.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
